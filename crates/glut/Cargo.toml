[package]
name = "glut"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A coding-agent harness as a library: a tool-calling loop over OpenAI-compatible, Anthropic and Responses APIs, with guarded file tools, every command in an OS sandbox, a permission gate and a network proxy."
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["agent", "llm", "sandbox", "coding-agent", "harness"]
categories = ["development-tools", "command-line-utilities"]

[features]
# T87: the secrets file read on macOS too (crates/glut/src/providers/secrets.rs `FILE_ALLOWED`) — the owner's builds
# while Glut is developed (scripts/install.sh, the bench); a build that goes to others keeps the Keychain alone.
dev-keys = []

[dependencies]
# The guarded file service the file tools go through, shared with the other Axiomata apps (Axiomata-Foundation).
axiomata-files.workspace = true
# HTTPS for remote model APIs (OpenRouter); rustls rather than the platform stack, like the rest of the tree would
# want it. Its own roots and the system's too (T56, `rustls-tls-native-roots`): a company's GitLab or proxy signed by
# an authority of its own, which the Mac's keychain trusts, is reached like any other host — for every connection.
reqwest = { workspace = true, features = ["rustls-tls", "rustls-tls-native-roots"] }
htmd.workspace = true
# `signal`: a run ends cleanly on Ctrl-C/SIGTERM/SIGHUP; `net`: the sandbox's network proxy (HS3b).
tokio = { workspace = true, features = ["signal", "net"] }
serde.workspace = true
# The fields of a server's form keep the order it named them in (T67, `mcp::elicit`).
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
globset.workspace = true
# A skill's `SKILL.md` frontmatter, like the roster's `AGENT.md` (HS6, K3).
gray_matter.workspace = true
# A hook's `matcher` is a regex, Claude's own spelling (HS7, D1/D2).
regex.workspace = true
# `process`: the shell tools kill a command's whole process group (HS2, S4).
rustix = { workspace = true, features = ["process", "termios"] }
chrono.workspace = true
clap.workspace = true
tracing-subscriber.workspace = true
# The fingerprint of an MCP server's config, which a project's server is approved by (HS5, M2).
sha2.workspace = true
# Code mode (Glut 2, G2): the QuickJS runtime a script runs in.
rquickjs.workspace = true
# Images (T45): the owner's and `read_file`'s, scaled before they go to a model.
image.workspace = true
# The ChatGPT sign-in's ID token, verified against OpenAI's published keys (PV4).
ring.workspace = true

# The macOS Keychain, where a provider's key waits between runs (docs/plans/glut-providers.md, P4).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

# The Linux sandbox (T59): its system call numbers, `prctl` and the seccomp filter's layout.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
# The fake model server of the tests listens on the loopback.
tokio = { workspace = true, features = ["net"] }
