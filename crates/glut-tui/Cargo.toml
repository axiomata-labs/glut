[package]
name = "glut-tui"
version = "0.1.2"
edition.workspace = true
license.workspace = true
description = "Glut, a coding agent for the terminal: every command sandboxed, a gate that asks before what matters, any model — panes, an arena, plans, editors."
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["agent", "llm", "tui", "coding-agent", "terminal"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "glut"
path = "src/main.rs"
# The binary shares its name with the harness crate: no second set of docs under the same name.
doc = false

[features]
# T87: see the glut crate's feature of the same name.
dev-keys = ["glut/dev-keys"]

[dependencies]
glut = { version = "0.1.2", path = "../glut" }
# The folder's files for the `@` finder, walked as the file tools walk them (`.gitignore` kept).
axiomata-files.workspace = true
# An owner's `!cmd` in a process group of its own, stopped as a whole (as Glut's shell tool does).
rustix = { workspace = true, features = ["process", "event"] }
# Layout and widgets (T2); the stream itself is our own model.
ratatui.workspace = true
crossterm.workspace = true
# Unix sockets: Glut windows on this machine talk to each other (T83, `sessions.rs`).
tokio = { workspace = true, features = ["net", "io-std"] }
clap.workspace = true
serde.workspace = true
chrono.workspace = true
# Once a day the newest version's number from glut-ai.com (#159): the same client and TLS as the library's.
reqwest = { workspace = true, features = ["rustls-tls", "rustls-tls-native-roots"] }
serde_json.workspace = true
unicode-width.workspace = true
# `html` for `/export`'s page (T54): its writer and escaping, one small crate of the same authors more.
pulldown-cmark = { workspace = true, features = ["html"] }
tree-sitter.workspace = true
tree-sitter-highlight.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-python.workspace = true
tree-sitter-swift.workspace = true
tree-sitter-toml-ng.workspace = true
tree-sitter-json.workspace = true
tree-sitter-bash.workspace = true
tree-sitter-css.workspace = true
tree-sitter-html.workspace = true
tree-sitter-yaml.workspace = true
tree-sitter-svelte-ng.workspace = true

[dev-dependencies]
# T87: the tests keep their secrets in a scratch home's file — never the owner's Keychain, which a build without the
# feature would read instead.
glut = { path = "../glut", features = ["dev-keys"] }
