[package]
name = "glut-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Glut's terminal interface (docs/plans/glut-tui.md): a full-screen session over the glut harness."

[[bin]]
name = "glut"
path = "src/main.rs"
# The binary shares its name with the harness crate: no second set of docs under the same name.
doc = false

[dependencies]
glut = { path = "../glut" }
# The folder's files for the `@` finder, walked as the file tools walk them (`.gitignore` kept).
axiomata-files = { path = "../../../Axiomata-Foundation/crates/axiomata-files" }
# An owner's `!cmd` in a process group of its own, stopped as a whole (as Glut's shell tool does).
rustix = { workspace = true, features = ["process"] }
# Layout and widgets (T2); the stream itself is our own model.
ratatui.workspace = true
crossterm.workspace = true
tokio = { workspace = true }
clap.workspace = true
serde.workspace = true
chrono.workspace = true
serde_json.workspace = true
unicode-width.workspace = true
pulldown-cmark.workspace = true
tree-sitter.workspace = true
tree-sitter-highlight.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-python.workspace = true
tree-sitter-swift.workspace = true
tree-sitter-toml-ng.workspace = true
tree-sitter-json.workspace = true
tree-sitter-bash.workspace = true
tree-sitter-css.workspace = true
tree-sitter-html.workspace = true
tree-sitter-yaml.workspace = true
tree-sitter-svelte-ng.workspace = true
