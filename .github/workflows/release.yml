# A tag `vX.Y.Z` makes a release: the program for macOS (arm64, x86_64) and Linux (x86_64, arm64; static, musl), each
# packed with the licences and the README, their SHA-256 checksums, the install script, and the notes of that version
# from CHANGELOG.md. A program of 50 MB or more fails the release (the site and the README say "under 50 MB"). Once
# the release stands, the Homebrew tap's formula is written anew — where the secret HOMEBREW_TAP_TOKEN (a token that
# may push to NamorX68/homebrew-tap) is set; without it that step is skipped with a note.
#
# The builds are unsigned for now (docs/install.md says how macOS lets them run); Developer ID signing and
# notarisation come with an Apple developer account.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to build (vX.Y.Z); the release is made only from a pushed tag"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The largest program a release takes, in bytes: under 50 MB.
  MOST_BYTES: "50000000"
  # The released program without its symbol tables (a static Linux build: 48 MB with them, 37 without); a local
  # build keeps them for its backtraces.
  CARGO_PROFILE_RELEASE_STRIP: "symbols"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: tag
        name: the tag names the version the manifests carry
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::not a version tag: $TAG"; exit 1 ;; esac
          version="${TAG#v}"
          manifest="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/glut-tui/Cargo.toml | head -1)"
          if [ "$version" != "$manifest" ]; then
            echo "::error::the tag says $version, crates/glut-tui/Cargo.toml says $manifest"
            exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section [$version]"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - id: foundation
        env:
          FOUNDATION_TOKEN: ${{ secrets.FOUNDATION_TOKEN }}
        run: |
          if [ -n "$FOUNDATION_TOKEN" ]; then
            echo "use=checkout" >> "$GITHUB_OUTPUT"
          else
            echo "use=git" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: glut
          persist-credentials: false
          ref: ${{ needs.version.outputs.tag }}
      - if: steps.foundation.outputs.use == 'checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NamorX68/Axiomata-Foundation
          path: Axiomata-Foundation
          token: ${{ secrets.FOUNDATION_TOKEN }}
          persist-credentials: false
      - if: steps.foundation.outputs.use == 'checkout'
        run: |
          mkdir -p glut/.cargo
          printf '[patch."https://github.com/NamorX68/Axiomata-Foundation"]\naxiomata-files = { path = "../Axiomata-Foundation/crates/axiomata-files" }\n' \
            > glut/.cargo/config.toml
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        name: musl's C compiler, for the C inside (QuickJS, tree-sitter's grammars, ring)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: build
        working-directory: glut
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked -p glut-tui --target "${{ matrix.target }}"
      - name: under 50 MB, and it runs
        working-directory: glut
        run: |
          program="target/${{ matrix.target }}/release/glut"
          bytes="$(wc -c < "$program" | tr -d ' ')"
          echo "glut for ${{ matrix.target }}: $bytes bytes"
          if [ "$bytes" -ge "$MOST_BYTES" ]; then
            echo "::error::glut is $bytes bytes, the release takes less than $MOST_BYTES"
            exit 1
          fi
          # An x86_64 program on the arm64 Mac runs under Rosetta where it is there; elsewhere it runs natively.
          "$program" --version || [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]
          if [ "$RUNNER_OS" = "Linux" ]; then file "$program" | grep -q "static" || { file "$program"; exit 1; }; fi
      - name: pack
        working-directory: glut
        run: |
          name="glut-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/glut" README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glut-${{ matrix.target }}
          path: glut/dist/glut-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    needs: [version, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: checksums, the install script and the notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cp scripts/install.sh dist/install.sh
          (cd dist && sha256sum glut-*.tar.gz install.sh > SHA256SUMS && cat SHA256SUMS)
          # The version's section of the changelog, without its heading.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { next }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - name: the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" --title "Glut $VERSION" --notes-file notes.md --verify-tag dist/*

  tap:
    needs: [version, release]
    runs-on: ubuntu-24.04
    steps:
      - id: token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set: the tap's formula is not written."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.tag }}
          path: glut
      - if: steps.token.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NamorX68/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - if: steps.token.outputs.skip != 'true'
        name: the formula, from the release's own checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir .
          sum() { awk -v name="glut-$1.tar.gz" '$2 == name { print $1 }' SHA256SUMS; }
          mkdir -p tap/Formula
          sed -e "s/@VERSION@/$VERSION/g" \
              -e "s/@SHA_MAC_ARM@/$(sum aarch64-apple-darwin)/" \
              -e "s/@SHA_MAC_INTEL@/$(sum x86_64-apple-darwin)/" \
              -e "s/@SHA_LINUX_ARM@/$(sum aarch64-unknown-linux-musl)/" \
              -e "s/@SHA_LINUX_INTEL@/$(sum x86_64-unknown-linux-musl)/" \
              glut/packaging/homebrew/glut.rb.in > tap/Formula/glut.rb
          # A placeholder left or a checksum not found stops the push.
          if grep -q '@SHA_\|@VERSION@\|sha256 ""' tap/Formula/glut.rb; then
            echo "::error::the formula misses a version or a checksum"
            exit 1
          fi
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/glut.rb
          git commit -m "glut $VERSION"
          git push
