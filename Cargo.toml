[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/axiomata-labs/glut"
homepage = "https://glut-ai.com"
authors = ["Roman Thimian"]

# The versions as Axiomata-OS has them: Axiomata builds Glut in its own tree, one version of each crate.
[workspace.dependencies]
# The guarded file service the file tools go through (Axiomata-Foundation, a repository of its own). Working beside
# it, `.cargo/config.toml` (local, not checked in) patches this source to the checkout next door.
axiomata-files = { git = "https://github.com/axiomata-labs/Axiomata-Foundation", branch = "main" }
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "fs", "io-util", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
gray_matter = "0.3"
regex = "1"
globset = "0.4"
# HTTP client; `glut` adds `rustls-tls` for remote model APIs (HTTPS to OpenRouter) in its own manifest. No other
# features — bodies are read chunk by chunk (`Response::chunk`), JSON goes through `serde_json`.
reqwest = { version = "0.12", default-features = false }
# Glut 2's code mode (G2): QuickJS, compiled in. `futures` turns an async Rust function into a
# JavaScript promise (a tool call from a script); `parallel` makes the runtime Send, so a run stays a Send future.
rquickjs = { version = "0.14", default-features = false, features = ["std", "futures", "parallel"] }
# HTML → Markdown for Glut's `web_fetch` (W1): a turndown port, no JavaScript runtime.
htmd = "0.5.6"
# Process groups and files opened without following a link; `glut` adds the features it needs.
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }
# The fingerprint of an MCP server's config, which a project's server is approved by (HS5, M2).
sha2 = "0.10"
# RSA signatures of a sign-in's ID token (PV4): the crate rustls already builds for TLS, nothing new compiled in.
ring = { version = "0.17", default-features = false, features = ["alloc"] }
# Images sent to a model (T45): read, scaled to what the APIs take, written as PNG or JPEG — nothing else of the crate.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# The terminal UI's terminal (T2): raw mode, events (keys, mouse, paste, resize, focus), the
# kitty keyboard protocol, synchronized output; `osc52` puts text on the clipboard over SSH and in tmux.
crossterm = { version = "0.29", features = ["osc52"] }
# The terminal UI's layout and widgets (T2): only the crossterm backend, on the crossterm above.
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm_0_29",
    "underline-color",
    "layout-cache",
] }
# How many cells a character takes (wide characters, emoji): the TUI wraps by cells, not by chars.
unicode-width = "0.2"
# The TUI's Markdown (T7): the answer is parsed as CommonMark with tables and task lists.
pulldown-cmark = { version = "0.13", default-features = false }
# Code blocks in colour (T7): tree-sitter's highlighter with the grammars of the owner's languages, built in.
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-swift = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-json = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tree-sitter-yaml = "0.7"
tree-sitter-svelte-ng = "1.0"

