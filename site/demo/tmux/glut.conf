# Scene 10's terminal: two Glut windows side by side, the shop on the left and the checkout on the right. A server of
# its own (tmux -L glut-demo); the session goes when the recorder's client does, and the server with it.
set -g status off
set -g destroy-unattached on
set -g escape-time 0
set -g pane-border-lines heavy
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour208
new-session "exec glut --provider anthropic --model claude-sonnet-5-5 --lang en"
split-window -h "cd ../checkout && exec glut --provider anthropic --model claude-sonnet-5-5 --lang en"
