<h1 id="glut">Glut</h1>
<p class="lead">Ein Agenten-Harness für das Terminal: Jeden Befehl, den ein Modell ausführt, hält eine
Betriebssystem-Sandbox und ein Netzwerk-Tor, jede Änderung lässt sich zurücknehmen, und die Arbeit macht das Modell,
das du willst.</p>
